; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
; The esp32cam board default is 460800, which this board + a cheap USB-TTL
; adapter does not reliably sustain - it shows up as
; "WARNING: Failed to communicate with the flash chip" right after the baud
; change, and the upload then fails. 115200 is slower but dependable.
; upload_speed = 115200
board_build.partitions = huge_app.csv
; -mfix-esp32-psram-cache-issue is deliberately NOT set. It works around a
; PSRAM cache erratum in ESP32 revision 1 silicon and costs real performance
; (extra instruction padding around every PSRAM access), which matters here
; because the camera frame buffers live in PSRAM. This board reports
; "ESP32-D0WD-V3 (revision v3.1)" at flash time, and rev 3 fixes that erratum
; in hardware, so the workaround buys nothing.
;
; If you ever build this for an older rev 1 board, put the flag back or you
; risk PSRAM data corruption. The revision is printed by esptool on upload.
build_flags =
    -DBOARD_HAS_PSRAM
; WebSockets/ArduinoJson are gone on purpose: video and control both run over
; esp_http_server now (bundled with the framework), the way the Espressif
; CameraWebServer example does it. No WebSocket means no session to keep
; alive, nothing to reconnect and no heartbeat to misfire.
lib_deps =
    olikraus/U8g2@^2.35.19
    madhephaestus/ESP32Servo@^3.0.5

; Full robot firmware: camera + HTTP stream/control + servos + OLED eyes.
[env:esp32cam]
build_src_filter = +<*> -<servo_test.cpp>

; Standalone servo bring-up test - no camera/WiFi/display involved, to
; isolate whether the servos + wiring work on this board at all.
; Build/upload with: pio run -e servo_test -t upload
; (or pick "servo_test" as the active environment in the PlatformIO sidebar)
[env:servo_test]
build_src_filter = +<servo_test.cpp> -<main.cpp>
